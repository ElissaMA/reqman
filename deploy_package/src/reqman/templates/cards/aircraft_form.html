{% extends "base.html" %}
{% block title %}{{ "编辑飞机" if edit_mode else "新增飞机" }} - 定检需求单管理{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">{{ "编辑飞机" if edit_mode else "新增飞机" }}</h5>
    <a href="/card/aircraft" class="btn btn-outline-secondary btn-sm">&larr; 返回</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" id="acForm">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label small">飞机号 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-sm" name="reg"
                           value="{{ ac.reg if ac else "" }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">机型</label>
                    <input type="text" class="form-control form-control-sm" name="model"
                           value="{{ ac.model if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small">发动机</label>
                    <input type="text" class="form-control form-control-sm" name="engine"
                           value="{{ ac.engine if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small">FSN</label>
                    <input type="text" class="form-control form-control-sm" name="fsn"
                           value="{{ ac.fsn if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small">MSN</label>
                    <input type="text" class="form-control form-control-sm" name="msn"
                           value="{{ ac.msn if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small">APU</label>
                    <input type="text" class="form-control form-control-sm" name="apu"
                           value="{{ ac.apu if ac else "" }}">
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-sm">保存</button>
                <a href="/card/aircraft" class="btn btn-outline-secondary btn-sm">取消</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
// 如果是从其他页面 window.open() 打开的，保存成功后自动关闭
if (window.opener) {
    document.getElementById("acForm").addEventListener("submit", function(e) {
        e.preventDefault();
        var form = this;
        var formData = new FormData(form);
        var acId = '{{ ac.id if ac else "" }}';
        var url = acId ? '/card/aircraft/' + acId + '/edit' : '/card/aircraft/new';

        fetch(url, {
            method: 'POST',
            body: formData
        }).then(function(resp) {
            if (resp.ok) {
                window.close();
            } else {
                form.submit();
            }
        }).catch(function() {
            form.submit();
        });
    });
}
</script>
{% endblock %}
