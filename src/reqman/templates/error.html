{% extends "base.html" %}
{% block title %}{{ code }} - 错误 - ReqMan定检准备系统{% endblock %}
{% block content %}

<div class="error-page">
    <div class="code">{{ code }}</div>
    <h4 class="text-muted mt-3">{{ message }}</h4>
    {% if detail %}
    <p class="text-muted small mt-2">{{ detail }}</p>
    {% endif %}
    <div class="mt-4">
        <a href="/" class="btn btn-primary btn-sm">返回首页</a>
        <button class="btn btn-outline-secondary btn-sm ms-2" onclick="history.back()">返回上页</button>
    </div>
</div>

{% endblock %}
