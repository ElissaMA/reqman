{% extends "base.html" %}
{% block title %}库存查询 - ReqMan定检准备系统{% endblock %}
{% block content %}
<div class="card mb-4">
    <div class="card-header"><h5 class="mb-0">📦 库存查询</h5></div>
    <div class="card-body">
        <!-- AMRO 登录状态与配置已迁移至表头（base.html），本页仅保留查询功能 -->

        <!-- 库存预警数据预留区 -->

        <!-- 查询区 -->
        <div class="alert alert-warning py-2 px-3 small mb-2">{{ messages.P1 }}</div>
        <div class="row g-3">
            <div class="col-md-8">
                <div class="upload-zone" id="zoneDemand" onclick="document.getElementById('demandFile').click()">
                    <div class="icon">📋</div>
                    <h6 class="mt-2">点击上传需求单 Excel</h6>
                    <p class="text-muted small mb-0">支持 .xlsx（含航材区/备用区）</p>
                    <input type="file" id="demandFile" name="file" accept=".xlsx" style="display:none"
                           onchange="fileSelected(this,'zoneDemand')">
                    <div class="file-name small text-success mt-2" style="display:none"></div>
                </div>
            </div>
            <div class="col-md-4 d-flex align-items-center">
                <button class="btn btn-success btn-sm px-4" id="startQueryBtn">查询库存</button>
            </div>
        </div>
        <div class="q-card" id="qCardStock" style="display:none"></div>
        <div id="resultBox" class="mt-3"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const MSG = {{ messages | tojson }};

function fileSelected(input, zoneId) {
    var zone = document.getElementById(zoneId);
    var name = input.files[0] ? input.files[0].name : '';
    if (name) {
        zone.classList.add('has-file');
        zone.querySelector('.file-name').textContent = '✅ ' + name;
        zone.querySelector('.file-name').style.display = 'block';
    }
}

function loadLatestOutput() {
    fetch('/inventory/latest-output', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(function(r) { return r.json(); }).then(function(d) {
            if (d.success && d.data && d.data.exists) {
                document.getElementById('resultBox').innerHTML =
                    '<div class="alert alert-success">' +
                    '上次查询结果（暂存）：' + d.data.filename + '<br>' +
                    '<a class="btn btn-primary btn-sm mt-2" href="/inventory/download?file=' +
                    encodeURIComponent(d.data.filename) + '">⬇ 下载副本</a></div>';
            }
        }).catch(function(){});
}

document.addEventListener('DOMContentLoaded', function() {
    loadLatestOutput();
    document.getElementById('startQueryBtn').addEventListener('click', function() {
        doQuery();
    });
    // 恢复进行中的库存查询轮询（刷新/重进页面后继续等待结果）
    fetch('/inventory/query-status', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(function(r) { return r.json(); }).then(function(d) {
            var status = (d && d.data) || {};
            if (status.status === 'running') {
                var card = window.QueryCard.run('qCardStock', '查询库存');
                pollInventoryQuery(card);
            }
        }).catch(function(){});
});

function renderResult(data) {
    document.getElementById('resultBox').innerHTML =
        '<div class="alert alert-success">' +
        '查询完成：共 ' + data.total + ' 件号，成功 ' + data.success +
        '，失败 ' + data.fail + '，标红 ' + data.shortage + '，标黄 ' + data.warning +
        '。<br>文件名：' + data.filename + '<br>' +
        '<a class="btn btn-primary btn-sm mt-2" href="/inventory/download?file=' +
        encodeURIComponent(data.filename) + '">⬇ 下载副本</a></div>';
}

function doQuery() {
    var input = document.getElementById('demandFile');
    if (!input.files.length) { window.safeToast('请先选择需求单 Excel 文件', 'warning'); return; }
    if (!window.amroSession || !window.amroSession.ready) { window.safeToast(MSG.P4, 'warning'); return; }
    var fd = new FormData();
    fd.append('file', input.files[0]);
    var card = window.QueryCard.run('qCardStock', '查询库存');
    fetch('/inventory/query', { method: 'POST', body: fd,
        headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(function(r) { return r.json().then(function(d) { return {code: r.status, d: d}; }); })
        .then(function(x) {
            if (x.code === 200 && x.d.success) {
                pollInventoryQuery(card);
            } else if (x.code === 409) {
                card.fail((x.d && x.d.message) || '已有查询任务进行中');
            } else {
                card.fail((x.d && x.d.message) || '启动失败');
            }
        }).catch(function() {
            card.fail('启动失败');
        });
}

function pollInventoryQuery(card) {
    window.Poller.poll({
        statusUrl: '/inventory/query-status',
        card: card,
        deadlineMin: 30,
        intervalMs: 2000,
        onDone: function(status, card) {
            var s = status.summary || {};
            var msg = '查询完成：共 ' + s.total + ' 件号，成功 ' + s.success + '，失败 ' + s.fail;
            card.done(msg);
            renderResult(s);
            window.safeToast(msg, 'success');
        },
        onError: function(err, card) {
            card.fail(err || '查询失败');
            window.safeToast(err || '查询失败', 'error');
        }
    });
}
</script>
{% endblock %}
