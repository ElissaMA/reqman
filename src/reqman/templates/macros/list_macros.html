{# 列表页公共组件：统一空状态 #}
{% macro empty_state(msg, action_url='', action_label='', colspan=1, open_modal=False, title='暂无数据') %}
<tr class="empty-state-row">
    <td colspan="{{ colspan }}" class="text-center">
        <div class="empty-state-icon" aria-hidden="true">—</div>
        <p class="empty-state-title">{{ title }}</p>
        <p class="empty-state-help">{{ msg }}</p>
        {% if action_url and action_label %}
            {% if open_modal %}
            <button type="button" onclick="ListUI.openEditor('{{ action_url }}')" class="btn btn-primary btn-sm mt-2">{{ action_label }}</button>
            {% else %}
            <a href="{{ action_url }}" class="btn btn-primary btn-sm mt-2">{{ action_label }}</a>
            {% endif %}
        {% endif %}
    </td>
</tr>
{% endmacro %}
