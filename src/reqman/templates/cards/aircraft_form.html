{% extends "base.html" %}
{% block title %}{{ "编辑飞机" if edit_mode else "新增飞机" }} - ReqMan 定检准备系统{% endblock %}
{% block content %}

<header class="page-header">
    <div class="page-heading">
        <div class="context-kicker">DATA MANAGEMENT / AIRCRAFT</div>
        <h1>{{ "编辑飞机" if edit_mode else "新增飞机" }}</h1>
        <p>登记飞机识别信息，保存后可在飞机清单中查看。</p>
    </div>
    <div class="page-actions"><a href="/card/aircraft" class="btn btn-outline-secondary btn-sm">返回飞机清单</a></div>
</header>

<div class="card">
    <div class="card-body">
        <form method="POST" id="acForm">
            <section class="form-section">
                <div class="form-section-heading"><div><h2>基本信息</h2><p class="section-description">机号为必填字段。</p></div></div>
                <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label small" for="reg">飞机号 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-sm" name="reg" id="reg"
                           value="{{ ac.reg if ac else "" }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small" for="model">机型</label>
                    <input type="text" class="form-control form-control-sm" name="model" id="model"
                           value="{{ ac.model if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small" for="engine">发动机</label>
                    <input type="text" class="form-control form-control-sm" name="engine" id="engine"
                           value="{{ ac.engine if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small" for="fsn">FSN</label>
                    <input type="text" class="form-control form-control-sm" name="fsn" id="fsn"
                           value="{{ ac.fsn if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small" for="msn">MSN</label>
                    <input type="text" class="form-control form-control-sm" name="msn" id="msn"
                           value="{{ ac.msn if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small" for="apu">APU</label>
                    <input type="text" class="form-control form-control-sm" name="apu" id="apu"
                           value="{{ ac.apu if ac else "" }}">
                </div>
            </section>
            <div class="form-actions">
                <a href="/card/aircraft" class="btn btn-outline-secondary btn-sm">取消</a>
                <button type="submit" class="btn btn-primary btn-sm px-4">{{ "保存修改" if edit_mode else "保存飞机" }}</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.getElementById("acForm").addEventListener("submit", function(e) {
    var reg = document.querySelector('input[name=reg]');
    if (reg && isBlank(reg.value)) {
        e.preventDefault();
        window.safeToast("机号不能为空", 'warning');
        return false;
    }
    // 从列表页 window.open() 打开时：AJAX 提交（经 apiSubmit 统一封装）
    if (window.opener) {
        e.preventDefault();
        var form = this;
        var acId = '{{ ac.id if ac else "" }}';
        var url = acId ? '/card/aircraft/' + acId + '/edit' : '/card/aircraft/new';
        window.apiSubmit(form, url, {
            onSuccess: function(d) {
                window.safeToast('保存成功', 'success');
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'aircraftSaved' }, '*');
                }
                setTimeout(function() { window.close(); }, 800);
            }
        });
        return false;
    }
});
</script>
{% endblock %}
