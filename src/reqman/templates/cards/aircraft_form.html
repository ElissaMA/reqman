{% extends "base.html" %}
{% block title %}{{ "编辑飞机" if edit_mode else "新增飞机" }} - ReqMan定检准备系统{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">{{ "编辑飞机" if edit_mode else "新增飞机" }}</h5>
    <a href="/card/aircraft" class="btn btn-outline-secondary btn-sm">&larr; 返回</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" id="acForm">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label small">飞机号 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-sm" name="reg"
                           value="{{ ac.reg if ac else "" }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">机型</label>
                    <input type="text" class="form-control form-control-sm" name="model"
                           value="{{ ac.model if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small">发动机</label>
                    <input type="text" class="form-control form-control-sm" name="engine"
                           value="{{ ac.engine if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small">FSN</label>
                    <input type="text" class="form-control form-control-sm" name="fsn"
                           value="{{ ac.fsn if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small">MSN</label>
                    <input type="text" class="form-control form-control-sm" name="msn"
                           value="{{ ac.msn if ac else "" }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small">APU</label>
                    <input type="text" class="form-control form-control-sm" name="apu"
                           value="{{ ac.apu if ac else "" }}">
                </div>
            </div>
            <div class="d-flex justify-content-between">
                <a href="/card/aircraft" class="btn btn-outline-secondary btn-sm">取消</a>
                <button type="submit" class="btn btn-primary btn-sm px-4">保存</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.getElementById("acForm").addEventListener("submit", function(e) {
    var reg = document.querySelector('input[name=reg]');
    if (reg && isBlank(reg.value)) {
        e.preventDefault();
        window.safeToast("机号不能为空", 'warning');
        return false;
    }
});

// 如果是从其他页面 window.open() 打开的，AJAX提交成功后自动关闭并通知父页刷新
if (window.opener) {
    document.getElementById("acForm").addEventListener("submit", function(e) {
        e.preventDefault();
        var reg = document.querySelector('input[name=reg]');
        if (reg && isBlank(reg.value)) {
            window.safeToast("机号不能为空", 'warning');
            return false;
        }
        var form = this;
        var formData = new FormData(form);
        var acId = '{{ ac.id if ac else "" }}';
        var url = acId ? '/card/aircraft/' + acId + '/edit' : '/card/aircraft/new';

        window.showLoader();
        fetch(url, {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        }).then(function(resp) {
            return resp.json();
        }).then(function(d) {
            window.hideLoader();
            if (d && d.success) {
                window.safeToast('保存成功', 'success');
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'aircraftSaved' }, '*');
                }
                setTimeout(function() { window.close(); }, 800);
            } else {
                window.safeToast((d && d.message) || '保存失败', 'error');
            }
        }).catch(function() {
            window.hideLoader();
            window.safeToast('提交失败，请重试', 'error');
        });
    });
}
</script>
{% endblock %}
