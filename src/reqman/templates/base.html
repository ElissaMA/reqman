<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReqMan定检准备系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ===== 布局 ===== */
        body { background: #f5f7fa; font-size: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        .navbar { background: linear-gradient(135deg, #1a3a5c, #2a5a8c) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar-brand { font-weight: 600; font-size: 18px; }
        .brand-en { font-weight: 700; letter-spacing: 0.5px; }
        .brand-sep { opacity: 0.45; margin: 0 7px; font-weight: 300; }
        .brand-zh { font-weight: 400; font-size: 15px; opacity: 0.88; letter-spacing: 1px; }
        .nav-link.active { background: rgba(255,255,255,0.15); border-radius: 6px; }
        .card { border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: none; transition: box-shadow 0.2s; }
        .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .card-header { background: #fff; border-bottom: 2px solid #e8ecf1; border-radius: 10px 10px 0 0 !important; font-weight: 600; }

        /* ===== 表格 ===== */
        .table th { background: #f0f4f8; white-space: nowrap; }
        .filter-row input { font-size: 12px; padding: 2px 6px; }
        .sortable { cursor: pointer; user-select: none; }
        .sortable:hover { background: #e6ecf3; }
        .sort-arrow { font-size: 10px; color: #8a9bb5; margin-left: 4px; }
        .empty-state-row td { background: transparent !important; }
        .preview-table { font-size: 13px; }
        .preview-table td { vertical-align: middle; }
        .gap-row td { height: 20px; background: #f0f4f8; }
        .gap-row td:first-child { font-weight: 600; color: #6c757d; font-size: 12px; }

        /* ===== 警告闪烁动画 ===== */
        @keyframes blink-warn {
            0% { border-color: #dc3545; box-shadow: 0 0 6px rgba(220,53,69,0.4); }
            50% { border-color: #dc3545; box-shadow: 0 0 12px rgba(220,53,69,0.7); }
            100% { border-color: #dc3545; box-shadow: 0 0 6px rgba(220,53,69,0.4); }
        }
        tr.blink-warn {
            animation: blink-warn 2s ease-in-out 3;
            border-left: 4px solid #dc3545 !important;
            background-color: #fff8f8;
        }
        tr.blink-warn td:first-child {
            padding-left: calc(0.5rem - 4px);
        }
        tr.blink-warn:hover {
            background-color: #fff0f0;
        }

        /* ===== 状态标签 ===== */
        .status-matched { background-color: #d4edda !important; }
        .status-new { background-color: #f8d7da !important; }
        .status-cancelled { background-color: #ffffff !important; color: #999 !important; }
        .badge-matched { background: #28a745; }
        .badge-new { background: #dc3545; }
        .badge-cancelled { background: #6c757d; }

        /* ===== 全局加载动画 ===== */
        .global-loader {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.75);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 12px;
        }
        .global-loader.active { display: flex; }
        .global-loader .spinner {
            width: 44px; height: 44px;
            border: 4px solid #e0e0e0;
            border-top-color: #1a3a5c;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .global-loader p { color: #555; font-size: 14px; margin: 0; }

        /* ===== 全局 Toast ===== */
        .toast-container {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast-container .toast {
            padding: 12px 20px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            animation: toastIn 0.3s ease;
            max-width: 380px;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast-container .toast.success { background: #2e7d32; }
        .toast-container .toast.error { background: #c62828; }
        .toast-container .toast.info { background: #1565c0; }
        .toast-container .toast.warning { background: #e65100; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ===== 锁定区域 ===== */
        .section-disabled {
            opacity: 0.5;
            background-color: #f5f5f5;
            pointer-events: none;
            border: 2px dashed #dc3545;
            border-radius: 6px;
            padding: 10px;
            transition: all 0.3s ease;
        }

        /* ===== 按钮hover增强 ===== */
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(25,118,210,0.3); }
        .btn-outline-primary:hover { background: #e3f2fd; }
        .btn-outline-danger:hover { background: #ffebee; }
        .btn-outline-secondary:hover { background: #f5f5f5; }
        .btn-outline-success:hover { background: #e8f5e9; }
        .btn-outline-warning:hover { background: #fff3e0; }

        /* ===== 链接hover ===== */
        a.text-decoration-none:hover { text-decoration: underline; }

        /* ===== 操作按钮hover ===== */
        .btn-sm.py-0:hover { background: #f0f4f8; }

        /* ===== 空状态（统一 48px 图标） ===== */
        .empty-state-icon { font-size: 48px; color: #c0c8d4; }

        /* ===== 上传区 ===== */
        .upload-zone {
            border: 2px dashed #c0c8d4;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafbfc;
        }
        .upload-zone:hover { border-color: #2a5a8c; background: #f0f4ff; }
        .upload-zone.has-file { border-color: #28a745; background: #f0fff4; }
        .upload-zone .icon { font-size: 48px; color: #8a9bb5; }

        /* ===== 错误页 ===== */
        .error-page { padding: 80px 0; text-align: center; }
        .error-page .code { font-size: 72px; font-weight: 700; color: #c0c8d4; }

        /* ===== 工具类 ===== */
        .btn-sm { font-size: 12px; }
        .container { max-width: 1200px; }

        /* ===== 响应式增强 ===== */
        @media (max-width: 768px) {
            .toast-container { right: 10px; left: 10px; }
            .toast { max-width: 100%; }
            .table { font-size: 13px; }
            .navbar-brand { font-size: 16px; }
        }
        @media (max-width: 480px) {
            .table th, .table td { padding: 6px 4px; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand d-inline-flex align-items-baseline" href="/"><span class="brand-en">ReqMan</span><span class="brand-sep">·</span><span class="brand-zh">定检准备系统</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle {{ 'active' if request.path.startswith('/card') }}"
                       href="#" role="button" data-bs-toggle="dropdown">
                        数据管理
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/card/aircraft">✈ 飞机信息</a></li>
                        <li><a class="dropdown-item" href="/card/list">📋 工卡信息</a></li>
                        <li><a class="dropdown-item" href="/card/sets">📦 工卡组管理</a></li>
                        <li><a class="dropdown-item" href="/card/logs">📝 操作日志</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{ 'active' if request.path == '/upload' }}" href="/upload">工作包</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{ 'active' if request.path == '/inventory' }}" href="/inventory">库存查询</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ===== 全局工具函数 =====
    window.showLoader = function() {
        document.getElementById('globalLoader').classList.add('active');
    };
    window.hideLoader = function() {
        document.getElementById('globalLoader').classList.remove('active');
    };
    window.showToast = function(message, type) {
        type = type || 'info';
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast ' + type;
        var icons = { success: '\u2713', error: '\u2717', warning: '\u26a0' };
        var icon = icons[type] || '\u2139';
        toast.innerHTML = '<span>' + icon + '</span> ' + message;
        container.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 4000);
    };
    // safeToast 兜底：showToast 异常（如容器缺失/JS 版本不匹配）时降级 alert，绝不静默失败
    window.safeToast = function(message, type) {
        try {
            if (typeof window.showToast === 'function' && document.getElementById('toastContainer')) {
                window.showToast(message, type);
            } else {
                window.alert(message);
            }
        } catch (e) {
            window.alert(message);
        }
    };
    // flash 时序修复：toastContainer 位于 body 末尾，须等 DOM 就绪后再渲染 flash
    window.renderFlashes = function() {
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        safeToast({{ message|tojson }}, {{ ('success' if category == 'success' else 'error' if category == 'error' else 'info')|tojson }});
        {% endfor %}
        {% endif %}
        {% endwith %}
    };
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            window.renderFlashes();
        });
    } else {
        window.renderFlashes();
    }
</script>

{# 公共列表筛选/排序：供各列表页复用 #}
<script>
window.AppFilter = (function () {
    function filter(inputId) {
        var input = document.getElementById(inputId);
        if (!input) return;
        var tbl = input.closest('table');
        if (!tbl) return;
        var inputs = tbl.querySelectorAll('.filter-row input, .filter-row select');
        tbl.querySelectorAll('tbody tr').forEach(function (r) {
            if (r.classList.contains('empty-state-row')) return;
            var show = true;
            inputs.forEach(function (inp) {
                var c = parseInt(inp.getAttribute('data-col'), 10);
                var val = inp.value.toLowerCase();
                if (val && r.children[c] && r.children[c].textContent.toLowerCase().indexOf(val) < 0) show = false;
            });
            r.style.display = show ? '' : 'none';
        });
    }
    function sort(tbl, col) {
        var tbody = tbl.querySelector('tbody');
        if (!tbody) return;
        var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr')).filter(function (r) {
            return !r.classList.contains('empty-state-row');
        });
        var arrow = tbl.querySelector('th.sortable[data-col="' + col + '"] .sort-arrow');
        var dir = arrow ? (arrow.getAttribute('data-dir') === 'asc' ? 1 : -1) : 1;
        var newDir = dir === 1 ? 'desc' : 'asc';
        rows.sort(function (a, b) {
            var va = (a.children[col] ? a.children[col].textContent : '').trim().toLowerCase();
            var vb = (b.children[col] ? b.children[col].textContent : '').trim().toLowerCase();
            if (va < vb) return -dir;
            if (va > vb) return dir;
            return 0;
        });
        rows.forEach(function (r) { tbody.appendChild(r); });
        tbl.querySelectorAll('th.sortable .sort-arrow').forEach(function (a) {
            a.innerHTML = '&#9650;';
            a.setAttribute('data-dir', 'asc');
        });
        if (arrow) {
            arrow.innerHTML = newDir === 'asc' ? '&#9650;' : '&#9660;';
            arrow.setAttribute('data-dir', newDir);
        }
    }
    return { filter: filter, sort: sort };
})();
</script>

{# 统一列表页UI工具：弹窗打开、AJAX删除、状态保留（搜索/滚动） #}
<script>
window.ListUI = (function() {
    var KEY = 'reqmanListState';

    // 保存当前页面搜索状态到 sessionStorage
    function saveState() {
        var state = { scrollTop: window.scrollY || 0, filters: {} };
        document.querySelectorAll('.filter-row input, .filter-row select').forEach(function(inp) {
            state.filters[inp.id] = inp.value;
        });
        try { sessionStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }

    // 恢复搜索状态并重新应用过滤
    function restoreState() {
        try {
            var raw = sessionStorage.getItem(KEY);
            if (!raw) return;
            var state = JSON.parse(raw);
            Object.keys(state.filters || {}).forEach(function(id) {
                var inp = document.getElementById(id);
                if (inp) inp.value = state.filters[id];
            });
            document.querySelectorAll('.filter-row input, .filter-row select').forEach(function(inp) {
                if (inp.value) window.AppFilter && window.AppFilter.filter(inp.id);
            });
            if (state.scrollTop) window.scrollTo(0, state.scrollTop);
        } catch (e) {}
    }

    // 统一打开编辑/新增窗口
    function openEditor(url) {
        window.open(url, '_blank', 'width=900,height=700');
    }

    // AJAX 删除：confirm + fetch + 成功后保留状态刷新
    function del(url, confirmMsg) {
        if (!window.confirm(confirmMsg || '确认删除？')) return;
        window.showLoader();
        fetch(url, {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        }).then(function(r) { return r.json(); }).then(function(d) {
            window.hideLoader();
            if (d && d.success) {
                window.showToast(d.message || '删除成功', 'success');
                saveState();
                window.location.reload();
            } else {
                window.showToast((d && d.message) || '删除失败', 'error');
            }
        }).catch(function() {
            window.hideLoader();
            window.showToast('删除失败', 'error');
        });
    }

    // 监听子窗口保存成功消息 → 保存状态并刷新
    window.addEventListener('message', function(e) {
        var d = e.data;
        if (d && d.type && /Saved$/.test(d.type)) {
            saveState();
            window.location.reload();
        }
    });

    // 页面加载时恢复状态
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', restoreState);
    } else {
        restoreState();
    }

    return { openEditor: openEditor, del: del, saveState: saveState, restoreState: restoreState };
})();
</script>
{% block scripts %}{% endblock %}

<div class="toast-container" id="toastContainer"></div>
<div class="global-loader" id="globalLoader">
    <div class="spinner"></div>
    <p>加载中...</p>
</div>
</body>
</html>
