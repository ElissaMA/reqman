{% extends "base.html" %}
{% import "macros/list_macros.html" as list %}
{% block title %}操作日志 - 定检需求单管理{% endblock %}
{% block content %}

<style>
.log-table td, .log-table th {
    vertical-align: middle;
}
</style>

<div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">操作日志 <span class="badge bg-secondary ms-2">共 <span id="logCount">{{ logs|length }}</span> 条</span></h5>
    </div>
    <div class="card-body">
        <form class="row g-2 align-items-end" onsubmit="return false;">
            <div class="col-auto">
                <label class="form-label small mb-1 text-muted">操作类型</label>
                <select name="operation" class="form-select form-select-sm" style="width:100px" onchange="filterLogs()">
                    <option value="">全部</option>
                    <option value="add">新增</option>
                    <option value="update">修改</option>
                    <option value="delete">删除</option>
                </select>
            </div>
            <div class="col-auto">
                <label class="form-label small mb-1 text-muted">目标类型</label>
                <select name="target_type" class="form-select form-select-sm" style="width:100px" onchange="filterLogs()">
                    <option value="">全部</option>
                    <option value="card">工卡</option>
                    <option value="set">工卡组</option>
                    <option value="aircraft">飞机信息</option>
                </select>
            </div>
            <div class="col-auto">
                <label class="form-label small mb-1 text-muted">关键词</label>
                <input type="text" name="keyword" class="form-control form-control-sm"
                       placeholder="搜索..." style="width:120px" oninput="filterLogs()">
            </div>
            <div class="col-auto">
                <label class="form-label small mb-1 text-muted">提交日期</label>
                <input type="date" name="date_from" class="form-control form-control-sm"
                       style="width:150px" onchange="filterLogs()">
            </div>
            <div class="col-auto d-flex gap-1">
                <button type="button" class="btn btn-sm btn-primary" onclick="filterLogs()">筛选</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="resetFilter()">重置</button>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0 log-table" id="logTable">
                <thead class="table-light">
                    <tr>
                        <th style="width:50px">ID</th>
                        <th style="width:150px">时间</th>
                        <th style="width:80px">操作</th>
                        <th style="width:80px">目标类型</th>
                        <th>目标标识</th>
                        <th>目标名称</th>
                        <th>变更内容</th>
                    </tr>
                </thead>
                <tbody id="logTableBody"></tbody>
            </table>
        </div>
        <div id="logEmpty" class="text-center py-5 text-muted" style="display:none">
            <p class="mb-1 fs-5">暂无日志记录</p>
            <small>当前筛选条件下没有找到操作日志</small>
        </div>
        <div id="logLoading" class="text-center py-2 text-muted small" style="display:none">
            <span id="logLoadingText">加载中...</span>
        </div>
    </div>
</div>

<script>
var logData = {{ logs|tojson }};
var operationLabels = {{ operation_labels|tojson }};
var targetTypeLabels = {{ target_type_labels|tojson }};
var fieldLabels = {{ field_labels|tojson }};
var PAGE_SIZE = 50;
var currentPage = 1;
var currentFiltered = [];

function formatChanges(changes) {
    if (!changes || !changes.length) return '';
    return changes.map(function(c) {
        var label = fieldLabels[c.field] || c.field;
        var oldVal = Array.isArray(c.old) ? '[' + c.old.length + ' 项]' : c.old;
        var newVal = Array.isArray(c.new) ? '[' + c.new.length + ' 项]' : c.new;
        return label + ': ' + oldVal + ' \u2192 ' + newVal;
    }).join('; ');
}

function renderLogs() {
    var tbody = document.getElementById('logTableBody');
    var empty = document.getElementById('logEmpty');
    var count = document.getElementById('logCount');
    var loading = document.getElementById('logLoading');
    var loadingText = document.getElementById('logLoadingText');

    var filtered = currentFiltered;
    var endIndex = currentPage * PAGE_SIZE;
    var slice = filtered.slice(0, endIndex);

    if (!filtered.length) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        loading.style.display = 'none';
        count.textContent = '0';
        return;
    }
    empty.style.display = 'none';
    count.textContent = filtered.length;

    if (endIndex < filtered.length) {
        loading.style.display = 'block';
        loadingText.textContent = '加载更多...';
    } else {
        loading.style.display = 'block';
        loadingText.textContent = '已加载全部 ' + filtered.length + ' 条';
    }

    var html = '';
    slice.forEach(function(l) {
        var opLabel = operationLabels[l.operation] || l.operation;
        var ttl = targetTypeLabels[l.target_type] || l.target_type;

        var opBadge = 'bg-secondary';
        if (l.operation === 'add') opBadge = 'bg-success';
        else if (l.operation === 'update') opBadge = 'bg-primary';
        else if (l.operation === 'delete') opBadge = 'bg-danger';

        var ttBadge = 'bg-light text-dark';
        if (l.target_type === 'card') ttBadge = 'bg-info text-dark';
        else if (l.target_type === 'set') ttBadge = 'bg-warning text-dark';
        else if (l.target_type === 'aircraft') ttBadge = 'bg-secondary';

        var changes = l.changes || [];
        var changesHtml = '-';
        if (changes.length) {
            var first = changes[0];
            var flabel = fieldLabels[first.field] || first.field;
            var titleAttr = formatChanges(changes);
            var newVal = first.new;
            if (typeof newVal !== 'string') newVal = JSON.stringify(newVal);
            if (newVal && newVal.length > 40) newVal = newVal.substring(0, 40);
            changesHtml = '<span title="' + titleAttr.replace(/"/g, '&quot;') + '">' +
                flabel + ': ' + newVal +
                (changes.length > 1 ? ' <span class="text-muted">…等' + changes.length + '项</span>' : '') +
                '</span>';
        }

        html += '<tr>' +
            '<td class="text-muted small">' + l.id + '</td>' +
            '<td class="small" title="' + (l.timestamp || '') + '">' + (l.timestamp || '').substring(0, 19) + '</td>' +
            '<td><span class="badge ' + opBadge + '">' + opLabel + '</span></td>' +
            '<td><span class="badge ' + ttBadge + '">' + ttl + '</span></td>' +
            '<td><code class="small">' + (l.target_identifier || '') + '</code></td>' +
            '<td class="small">' + (l.target_name || '') + '</td>' +
            '<td class="small" style="max-width:350px">' + changesHtml + '</td>' +
            '</tr>';
    });
    tbody.innerHTML = html;
}

function filterLogs() {
    var op = document.querySelector('select[name="operation"]').value;
    var tt = document.querySelector('select[name="target_type"]').value;
    var kw = document.querySelector('input[name="keyword"]').value.trim().toLowerCase();
    var df = document.querySelector('input[name="date_from"]').value;

    var filtered = logData.filter(function(l) {
        if (op && l.operation !== op) return false;
        if (tt && l.target_type !== tt) return false;
        if (kw) {
            var idf = (l.target_identifier || '').toLowerCase();
            var tn = (l.target_name || '').toLowerCase();
            if (idf.indexOf(kw) < 0 && tn.indexOf(kw) < 0) return false;
        }
        if (df) {
            var ts = (l.timestamp || '').substring(0, 10);
            if (ts < df) return false;
        }
        return true;
    });

    currentFiltered = filtered;
    currentPage = 1;
    renderLogs();
}

function resetFilter() {
    document.querySelector('select[name="operation"]').value = '';
    document.querySelector('select[name="target_type"]').value = '';
    document.querySelector('input[name="keyword"]').value = '';
    document.querySelector('input[name="date_from"]').value = '';
    filterLogs();
}

document.addEventListener('DOMContentLoaded', function() {
    filterLogs();
    // 滚动加载
    document.querySelector('.table-responsive').addEventListener('scroll', function() {
        if (currentFiltered.length <= currentPage * PAGE_SIZE) return;
        if (this.scrollHeight - this.scrollTop - this.clientHeight < 50) {
            currentPage++;
            renderLogs();
        }
    });
});
</script>
{% endblock %}
